# Include from nginx's http context (for example, /etc/nginx/conf.d/cytube.conf).
# Assumes nginx and cloudflared run directly on the Docker host.
map $http_upgrade $cytube_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $cytube_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 127.0.0.1:9080;
    server_name _;

    # Only the local tunnel connector may supply the original client IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $cytube_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $cytube_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:1337;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8980;
    }
}
